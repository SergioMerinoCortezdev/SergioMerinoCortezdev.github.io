<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Equipos</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="bg-light">

    <div class="container py-5">
        <!-- Encabezado -->
        <div class="text-center mb-4">
            <h1 class="fw-bold text-primary">Enrolamiento expres o ineq</h1>
        </div>

        <!-- Tarjeta de Filtros -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body p-4">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Seleccionar Marca</label>
                        <select class="form-select marcas-select">
                            <option value="" selected disabled>Cargando marcas...</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Buscar Modelo</label>
                        <input type="text" class="form-control input-models" placeholder="Escribe para buscar...">
                    </div>
                </div>
            </div>
        </div>

        <!-- Tarjeta de Resultados (Tabla) -->
        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-primary">
                            <tr>
                                <th scope="col" class="ps-4">Modelo</th>
                                <th scope="col">SKU / NUMBER</th>
                                <th scope="col">Enrolamiento</th>
                            </tr>
                        </thead>
                        <tbody class="table_model">
                            <!-- Los tr se insertan con JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- SheetJS & JS local -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
